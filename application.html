<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка на выпуск - AlR1_Beats</title>

    <link rel="stylesheet" href="css/Site.css">
</head>

<body>

    <!-- ==================== ШАПКА САЙТА ==================== -->
    <header class="main-header">
        <div class="container">
            <div class="logo">AlR1_Beats</div>

            <div class="menu-toggle" id="mobile-menu">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>

            <nav class="nav-menu" id="nav-menu">

                    <li><a href="index.html">Главная</a></li>
                    <li><a href="about.html">О нас</a></li>

                    <li><a href="release.html">Выпуск музыки</a></li>
                    <li><a href="profile.html">Профиль</a></li>
                    <li><a href="login.html">Вход/Регистрация</a></li>
                    <li><a href="contact.html">Контакты</a></li>
                    <li><a href="application.html">Заявка</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <!-- ==================== КОНЕЦ ШАПКИ ==================== -->


    <!-- ==================== ОСНОВНОЕ СОДЕРЖИМОЕ ==================== -->
    <main>
        <!-- Секция "Заявка на выпуск музыки" -->
        <section class="application-section">
            <div class="container">
                <h2>Заявка на выпуск музыки</h2>
                <p>Заполните форму, чтобы начать сотрудничество с нами</p>

                <!-- Форма заявки -->
                <div class="form-wrapper application-form-wrapper">
                    <form id="application-form">

                        <!-- 1. TEXT - Имя артиста -->
                        <div class="form-group">
                            <label for="artist-name-app">Имя артиста *</label>
                            <input type="text" id="artist-name-app" name="artist_name"
                                   placeholder="Введите ваше сценическое имя" required>
                        </div>

                        <!-- 2. EMAIL - Электронная почта -->
                        <div class="form-group">
                            <label for="application-email">Email *</label>
                            <input type="email" id="application-email" name="email"
                                   placeholder="name@example.com" required>
                        </div>

                        <!-- 3. TEL - Телефон -->
                        <div class="form-group">
                            <label for="application-phone">Телефон</label>
                            <input type="tel" id="application-phone" name="phone"
                                   placeholder="89991112233 ">
                        </div>

                        <!-- 4. SELECT - Выбор жанра -->
                        <div class="form-group">
                            <label for="application-genre">Жанр музыки *</label>
                            <select id="application-genre" name="genre" required>
                                <option value="">Выберите жанр</option>
                                <option value="hip-hop">Хип-хоп / Рэп</option>
                                <option value="pop">Поп</option>
                                <option value="rock">Рок</option>
                                <option value="rnb">R&B</option>
                                <option value="electronic">Электронная</option>
                                <option value="indie">Инди</option>
                                <option value="other">Другое</option>
                            </select>
                        </div>

                        <!-- 5. NUMBER - Количество треков -->
                        <div class="form-group">
                            <label for="application-tracks">Количество треков *</label>
                            <input type="number" id="application-tracks" name="track_count"
                                   min="1" max="100" placeholder="Например: 5" required>
                        </div>

                        <!-- 6. TEXT - Название музыки -->
                        <div class="form-group">
                            <label for="track">Название музыки *</label>
                            <input type="text" id="track" name="track_name"
                                   placeholder="Введите ваш никнейм и название песен" required>
                        </div>

                        <!-- 7. RADIO - Опыт работы -->
                        <div class="form-group">
                            <label>Ваш опыт работы *</label>
                            <div class="radio-group">
                                <div class="radio-item">
                                    <input type="radio" id="exp-new" name="experience" value="newbie" required>
                                    <label for="exp-new">Новичок (первый релиз)</label>
                                </div>
                                <div class="radio-item">
                                    <input type="radio" id="exp-some" name="experience" value="some" required>
                                    <label for="exp-some">Есть 1-3 релиза</label>
                                </div>
                                <div class="radio-item">
                                    <input type="radio" id="exp-experienced" name="experience" value="experienced" required>
                                    <label for="exp-experienced">Опытный (более 3 релизов)</label>
                                </div>
                            </div>
                        </div>

                        <!-- 8. TEXTAREA - Ссылки на соцсети -->
                        <div class="form-group">
                            <label for="application-social">Ссылки на соцсети</label>
                            <textarea id="application-social" name="social_links" rows="3"
                                      placeholder="VK, Telegram, YouTube и т.д."></textarea>
                        </div>

                        <!-- 9. CHECKBOX - Согласие с правилами -->
                        <div class="form-group checkbox-group">
                            <input type="checkbox" id="agree-rules" name="agree_rules" required>
                            <label for="agree-rules">Я согласен с правилами сервиса *</label>
                        </div>

                        <!-- 10. CHECKBOX - Подписка на рассылку -->
                        <div class="form-group checkbox-group">
                            <input type="checkbox" id="agree-newsletter" name="agree_newsletter">
                            <label for="agree-newsletter">Хочу получать новости и обновления</label>
                        </div>

                        <!-- Кнопка отправки -->
                        <button type="submit" class="btn btn-primary btn-lg w-100">Отправить заявку</button>

                    </form>
                </div>
            </div>
        </section>
    </main>
    <!-- ==================== КОНЕЦ ОСНОВНОГО СОДЕРЖИМОГО ==================== -->

        </div>
    </footer>

</body>
